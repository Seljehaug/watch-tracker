# Lint, test and build on every push to main and every pull request (D73).
# The deploy workflow calls this one first (workflow_call), so it only deploys
# a commit that passed these checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # GitHub sets CI=true, so the tests run once instead of watching.
      - run: npm test

      - run: npm run build
