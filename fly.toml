# Fly.io's settings for the app (M2 A4, D2, D72), read by `flyctl deploy` in the deploy workflow.
# Deploys come from that workflow only, never from the Mac (D73).
app = "watch-tracker"
# Frankfurt, next to the Neon project (aws-eu-central-1), so a query is a few milliseconds away.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  # The port Kestrel listens on in aspnet:10.0 (its ASPNETCORE_HTTP_PORTS, Dockerfile v2).
  internal_port = 8080
  force_https = true
  # Always on: Fly's proxy would otherwise stop an idle machine, and the next visit would
  # wait for it to start (D60, D72). One machine, kept running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # A deploy only counts as done once the new machine answers. /healthz never touches the
  # database (D75): a check that queried Neon every 30 seconds would keep it awake and use up its
  # free compute hours, and a slow wake-up would make Fly stop sending traffic to the app.
  # The first check waits 30 seconds: the app runs the migrations before it listens (D68), Neon
  # may have to wake up first, and .NET starts slower than nginx on a shared CPU.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# shared-cpu-1x with 512 MB, since .NET needs more room than nginx's 256 MB (D2). One machine of
# this size stays under the bill Fly waives for a personal organization (D72).
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
