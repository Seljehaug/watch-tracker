<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continue watching – desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 760px; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <header style="border-bottom: 1px solid {{c.border}}">
    <div style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: {{c.accent}}; color: {{c.onAccent}}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path><path d="M10.5 9v4l3-2z"></path></svg>
        </span>
        <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Watch Tracker</span>
      </div>
      <a href="Edit.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; background: {{c.accent}}; color: {{c.onAccent}}; text-decoration: none; font-size: 15px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Add show</span>
      </a>
    </div>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 36px 24px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap">
      <div>
        <h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">{{heading}}</h1>
        <p style="margin: 8px 0 0; font-size: 15px; color: {{c.muted}}">{{subheading}}</p>
      </div>
      <nav aria-label="Show status" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 600; white-space: nowrap">
            <span>{{t.label}}</span>
            <span style="font-variant-numeric: tabular-nums; font-weight: 500; opacity: 0.75">{{t.count}}</span>
          </button>
        </sc-for>
      </nav>
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px 0; text-align: center; color: {{c.muted}}; font-size: 15px">Nothing here yet.</div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px">
      <sc-for list="{{cards}}" as="s" hint-placeholder-count="6">
        <article style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: {{c.surface}}; border: 1px solid {{c.border}}">
          <div aria-hidden="true" style="flex: none; width: 52px; height: 74px; border-radius: 8px; background: {{c.surface2}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: {{c.muted}}">{{s.initials}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <a href="Edit.dc.html" style="font-size: 16px; font-weight: 600; line-height: 1.25; text-decoration: none; color: {{c.text}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</a>
            <div style="display: flex; align-items: baseline; gap: 6px">
              <span style="font-size: 12px; color: {{c.muted}}">{{s.progLabel}}</span>
              <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{s.progColor}}">{{s.progValue}}</span>
            </div>
            <div style="font-size: 13px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.meta}}</div>
          </div>
          <sc-if value="{{s.hasAction}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-label="{{s.actionAria}}" onClick="{{s.act}}" style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid {{c.accentLine}}; background: {{c.accentSoft}}; color: {{c.accent}}; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              <span>{{s.actionLabel}}</span>
            </button>
          </sc-if>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cinema","midnight","plum"],"default":"cinema"},"$preview":{"width":1280,"height":760}}'>
var PALETTES = {
  cinema:   { bg: '#0E0E10', surface: '#17171A', surface2: '#232328', border: '#2C2C33', text: '#F4F4F5', muted: '#A1A1AA', accent: '#F5B841', onAccent: '#1C1404', accentSoft: 'rgba(245,184,65,0.12)', accentLine: 'rgba(245,184,65,0.35)' },
  midnight: { bg: '#0A0F1C', surface: '#111A2C', surface2: '#1B253A', border: '#253150', text: '#EDF2FB', muted: '#9BA8C2', accent: '#6CC6FF', onAccent: '#03131F', accentSoft: 'rgba(108,198,255,0.12)', accentLine: 'rgba(108,198,255,0.35)' },
  plum:     { bg: '#130F17', surface: '#1C1721', surface2: '#282031', border: '#362C42', text: '#F6F1F9', muted: '#B3A6BF', accent: '#FF8F73', onAccent: '#2B0E06', accentSoft: 'rgba(255,143,115,0.13)', accentLine: 'rgba(255,143,115,0.38)' }
};
var TABS = [
  { id: 'watching', label: 'Watching', heading: 'Continue watching', one: 'show in progress', many: 'shows in progress' },
  { id: 'want', label: 'Want to watch', heading: 'Want to watch', one: 'show on your list', many: 'shows on your list' },
  { id: 'finished', label: 'Finished', heading: 'Finished', one: 'show finished', many: 'shows finished' },
  { id: 'dropped', label: 'Dropped', heading: 'Dropped', one: 'show dropped', many: 'shows dropped' }
];
var SEED = [
  { id: 1, title: 'Slow Horses', service: 'Apple TV+', status: 'watching', s: 4, e: 3, ago: '2 hours ago', u: 20 },
  { id: 2, title: 'Severance', service: 'Apple TV+', status: 'watching', s: 2, e: 7, ago: 'Yesterday', u: 19 },
  { id: 3, title: 'The Bear', service: 'Disney+', status: 'watching', s: 3, e: 5, ago: '3 days ago', u: 18 },
  { id: 4, title: 'Lykkeland', service: 'NRK TV', status: 'watching', s: 2, e: 2, ago: 'Last week', u: 17 },
  { id: 5, title: 'Shōgun', service: 'Disney+', status: 'watching', s: 1, e: 8, ago: '2 weeks ago', u: 16 },
  { id: 6, title: 'Andor', service: 'Disney+', status: 'watching', s: 2, e: 4, ago: '3 weeks ago', u: 15 },
  { id: 7, title: 'The Penguin', service: 'HBO Max', status: 'want', s: 0, e: 0, ago: '4 days ago', u: 14 },
  { id: 8, title: 'Ripley', service: 'Netflix', status: 'want', s: 0, e: 0, ago: '2 weeks ago', u: 13 },
  { id: 9, title: 'Exit', service: 'NRK TV', status: 'want', s: 0, e: 0, ago: 'Last month', u: 12 },
  { id: 10, title: 'Pachinko', service: 'Apple TV+', status: 'want', s: 0, e: 0, ago: 'Last month', u: 11 },
  { id: 11, title: 'Succession', service: 'HBO Max', status: 'finished', s: 4, e: 10, ago: 'in March', u: 10 },
  { id: 12, title: 'Dark', service: 'Netflix', status: 'finished', s: 3, e: 8, ago: 'in January', u: 9 },
  { id: 13, title: 'Beforeigners', service: 'HBO Max', status: 'finished', s: 2, e: 6, ago: 'last year', u: 8 },
  { id: 14, title: 'The Rings of Power', service: 'Prime Video', status: 'dropped', s: 1, e: 4, ago: 'last year', u: 7 }
];
function pad(n) { return String(n).padStart(2, '0'); }
function initials(t) { return t.replace(/^The /, '').split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase(); }

class Component extends DCLogic {
  act(show) {
    var st = this.state || {};
    var shows = (st.shows || SEED).slice();
    var top = Math.max.apply(null, shows.map(function (x) { return x.u; })) + 1;
    shows = shows.map(function (x) {
      if (x.id !== show.id) return x;
      if (x.status === 'want') return Object.assign({}, x, { status: 'watching', s: 1, e: 1, u: top, ago: 'Just now' });
      return Object.assign({}, x, { e: x.e + 1, u: top, ago: 'Just now' });
    });
    this.setState({ shows: shows, tab: 'watching' });
  }
  renderVals() {
    var self = this;
    var c = PALETTES[this.props.palette ?? 'cinema'] || PALETTES.cinema;
    var st = this.state || {};
    var tab = st.tab || 'watching';
    var shows = st.shows || SEED;
    var tabs = TABS.map(function (t) {
      var on = t.id === tab;
      return {
        label: t.label,
        count: shows.filter(function (x) { return x.status === t.id; }).length,
        pressed: on ? 'true' : 'false',
        bg: on ? c.accent : c.surface,
        fg: on ? c.onAccent : c.text,
        bd: on ? c.accent : c.border,
        pick: function () { self.setState({ tab: t.id }); }
      };
    });
    var cur = TABS.filter(function (t) { return t.id === tab; })[0];
    var list = shows.filter(function (x) { return x.status === tab; }).sort(function (a, b) { return b.u - a.u; });
    var cards = list.map(function (x) {
      var now = 'S' + pad(x.s) + ' E' + pad(x.e);
      var next = 'S' + pad(x.s) + ' E' + pad(x.e + 1);
      var card = { title: x.title, initials: initials(x.title), hasAction: false, actionLabel: '', actionAria: '', progColor: c.text, act: function () { self.act(x); } };
      if (x.status === 'watching') { card.progLabel = 'Last watched'; card.progValue = now; card.meta = x.service + ' · ' + x.ago; card.hasAction = true; card.actionLabel = 'E' + pad(x.e + 1); card.actionAria = 'Mark ' + next + ' of ' + x.title + ' as watched'; }
      if (x.status === 'want') { card.progLabel = ''; card.progValue = 'Not started'; card.progColor = c.muted; card.meta = x.service + ' · Added ' + x.ago.toLowerCase(); card.hasAction = true; card.actionLabel = 'E01'; card.actionAria = 'Start ' + x.title + ': mark S01 E01 as watched'; }
      if (x.status === 'finished') { card.progLabel = 'Ended at'; card.progValue = now; card.meta = x.service + ' · Finished ' + x.ago; }
      if (x.status === 'dropped') { card.progLabel = 'Stopped at'; card.progValue = now; card.meta = x.service + ' · Dropped ' + x.ago; }
      return card;
    });
    return {
      c: c,
      tabs: tabs,
      cards: cards,
      isEmpty: cards.length === 0,
      heading: cur.heading,
      subheading: list.length + ' ' + (list.length === 1 ? cur.one : cur.many)
    };
  }
}
</script>
</body>
</html>
