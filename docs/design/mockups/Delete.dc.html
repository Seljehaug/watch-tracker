<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delete show</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
a:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 4px; padding: 8px; border-bottom: 1px solid {{c.border}}">
      <span style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px; color: {{c.accent}}; font-size: 16px; font-weight: 500">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        <span>Back</span>
      </span>
    </div>
    <div style="padding: 20px; display: flex; flex-direction: column; gap: 22px">
      <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Edit show</div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 14px; font-weight: 600">Title</div>
        <div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; font-size: 16px">Severance</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 14px; font-weight: 600">Status</div>
        <div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; font-size: 16px">Watching</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 14px; font-weight: 600">Where I watch it</div>
        <div style="height: 50px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; font-size: 16px">Apple TV+</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.62)"></div>

  <dialog open aria-labelledby="del-title" aria-describedby="del-desc" style="position: absolute; left: 12px; right: 12px; bottom: 16px; top: auto; margin: 0; width: auto; box-sizing: border-box; padding: 24px 20px 20px; border-radius: 20px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; box-shadow: 0 -8px 40px rgba(0,0,0,0.5)">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: {{c.dangerSoft}}; color: {{c.danger}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="del-title" style="margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">Delete Severance?</h2>
        <p id="del-desc" style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.muted}}">The show and your progress (<span style="color: {{c.text}}; font-weight: 600; font-variant-numeric: tabular-nums">S02 E07</span>) will be removed. This can’t be undone.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: {{c.dangerSolid}}; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700">Delete show</a>
        <a href="Edit.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; border: 1px solid {{c.border}}; color: {{c.text}}; text-decoration: none; font-size: 16px; font-weight: 600">Cancel</a>
      </div>
    </div>
  </dialog>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cinema","midnight","plum"],"default":"cinema"},"$preview":{"width":390,"height":844}}'>
var PALETTES = {
  cinema:   { bg: '#0E0E10', surface: '#17171A', border: '#2C2C33', text: '#F4F4F5', muted: '#A1A1AA', accent: '#F5B841', danger: '#FF8A8A', dangerSoft: 'rgba(255,138,138,0.12)', dangerSolid: '#C62828' },
  midnight: { bg: '#0A0F1C', surface: '#111A2C', border: '#253150', text: '#EDF2FB', muted: '#9BA8C2', accent: '#6CC6FF', danger: '#FF8A8A', dangerSoft: 'rgba(255,138,138,0.12)', dangerSolid: '#C62828' },
  plum:     { bg: '#130F17', surface: '#1C1721', border: '#362C42', text: '#F6F1F9', muted: '#B3A6BF', accent: '#FF8F73', danger: '#FF9A9A', dangerSoft: 'rgba(255,154,154,0.12)', dangerSolid: '#C62828' }
};
class Component extends DCLogic {
  renderVals() {
    return { c: PALETTES[this.props.palette ?? 'cinema'] || PALETTES.cinema };
  }
}
</script>
</body>
</html>
