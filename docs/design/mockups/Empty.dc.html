<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continue watching – empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid {{c.border}}">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: {{c.accent}}; color: {{c.onAccent}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path><path d="M10.5 9v4l3-2z"></path></svg>
      </span>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Watch Tracker</span>
    </div>
  </header>

  <div style="padding: 22px 20px 6px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Continue watching</h1>
    <p style="margin: 6px 0 0; font-size: 14px; color: {{c.muted}}">0 shows in progress</p>
  </div>

  <nav aria-label="Show status" style="display: flex; gap: 8px; padding: 12px 20px 14px; overflow-x: auto">
    <button type="button" aria-pressed="true" style="flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.accent}}; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 14px; font-weight: 600">Watching <span style="font-weight: 500; opacity: 0.75">0</span></button>
    <button type="button" aria-pressed="false" style="flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-weight: 600; white-space: nowrap">Want to watch <span style="font-weight: 500; opacity: 0.75">0</span></button>
    <button type="button" aria-pressed="false" style="flex: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 14px; font-weight: 600">Finished <span style="font-weight: 500; opacity: 0.75">0</span></button>
  </nav>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 36px 96px; gap: 20px">
    <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 28px; background: {{c.accentSoft}}; color: {{c.accent}}">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8"></path><path d="M10.5 9v4l3-2z"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em">Nothing on the go yet</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{c.muted}}">Add the shows you’re watching, and you’ll always know where you stopped – and where to pick up.</p>
    </div>
    <a href="Edit.dc.html" style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 12px; background: {{c.accent}}; color: {{c.onAccent}}; text-decoration: none; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span>Add your first show</span>
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cinema","midnight","plum"],"default":"cinema"},"$preview":{"width":390,"height":844}}'>
var PALETTES = {
  cinema:   { bg: '#0E0E10', surface: '#17171A', border: '#2C2C33', text: '#F4F4F5', muted: '#A1A1AA', accent: '#F5B841', onAccent: '#1C1404', accentSoft: 'rgba(245,184,65,0.12)' },
  midnight: { bg: '#0A0F1C', surface: '#111A2C', border: '#253150', text: '#EDF2FB', muted: '#9BA8C2', accent: '#6CC6FF', onAccent: '#03131F', accentSoft: 'rgba(108,198,255,0.12)' },
  plum:     { bg: '#130F17', surface: '#1C1721', border: '#362C42', text: '#F6F1F9', muted: '#B3A6BF', accent: '#FF8F73', onAccent: '#2B0E06', accentSoft: 'rgba(255,143,115,0.13)' }
};
class Component extends DCLogic {
  renderVals() {
    return { c: PALETTES[this.props.palette ?? 'cinema'] || PALETTES.cinema };
  }
}
</script>
</body>
</html>
