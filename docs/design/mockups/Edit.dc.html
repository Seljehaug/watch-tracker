<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit show</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid currentColor;outline-offset:2px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px; border-bottom: 1px solid {{c.border}}">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{c.accent}}; font-size: 16px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      <span>Back</span>
    </a>
  </header>

  <form style="flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 22px">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em">Edit show</h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-title" style="font-size: 14px; font-weight: 600">Title</label>
      <input id="f-title" type="text" value="{{title}}" onChange="{{onTitle}}" aria-invalid="{{titleInvalid}}" aria-describedby="f-title-msg" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{titleBorder}}; background: {{c.surface}}; color: {{c.text}}; font-size: 16px">
      <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
        <p id="f-title-msg" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{c.danger}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
          <span>Title is required.</span>
        </p>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-status" style="font-size: 14px; font-weight: 600">Status</label>
      <div style="position: relative">
        <select id="f-status" defaultValue="watching" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 44px 0 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 16px; appearance: none; -webkit-appearance: none">
          <option value="want">Want to watch</option>
          <option value="watching">Watching</option>
          <option value="finished">Finished</option>
          <option value="dropped">Dropped</option>
        </select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-service" style="font-size: 14px; font-weight: 600">Where I watch it <span style="font-weight: 400; color: {{c.muted}}">(optional)</span></label>
      <div style="position: relative">
        <select id="f-service" defaultValue="apple" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 44px 0 14px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; font-size: 16px; appearance: none; -webkit-appearance: none">
          <option value="">Not set</option>
          <option value="netflix">Netflix</option>
          <option value="prime">Prime Video</option>
          <option value="hbo">HBO Max</option>
          <option value="viaplay">Viaplay</option>
          <option value="disney">Disney+</option>
          <option value="apple">Apple TV+</option>
          <option value="nrk">NRK TV</option>
          <option value="tv2">TV 2 Play</option>
          <option value="other">Other</option>
        </select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 16px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Last watched episode</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{steppers}}" as="st" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="{{st.id}}" style="font-size: 13px; color: {{c.muted}}">{{st.label}}</label>
            <div style="display: flex; align-items: center; height: 50px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; overflow: hidden">
              <button type="button" aria-label="{{st.decLabel}}" onClick="{{st.dec}}" style="flex: none; width: 44px; height: 100%; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
              </button>
              <input id="{{st.id}}" type="number" inputMode="numeric" min="1" value="{{st.value}}" onChange="{{st.onInput}}" placeholder="–" style="flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: {{c.text}}; text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">
              <button type="button" aria-label="{{st.incLabel}}" onClick="{{st.inc}}" style="flex: none; width: 44px; height: 100%; border: 0; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
          </div>
        </sc-for>
      </div>
      <p style="margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: {{c.muted}}">Shown as <strong style="color: {{c.text}}; font-variant-numeric: tabular-nums">{{progress}}</strong>. Leave empty if you haven’t started.</p>
    </fieldset>

    <a href="Delete.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px; text-decoration: none; color: {{c.danger}}; font-size: 15px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"></path></svg>
      <span>Delete show</span>
    </a>
  </form>

  <div style="display: flex; gap: 10px; padding: 12px 20px 24px; border-top: 1px solid {{c.border}}; background: {{c.bg}}">
    <a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; border: 1px solid {{c.border}}; color: {{c.text}}; text-decoration: none; font-size: 16px; font-weight: 600">Cancel</a>
    <button type="button" onClick="{{save}}" style="flex: 2; height: 52px; border-radius: 12px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 16px; font-weight: 700">Save changes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["cinema","midnight","plum"],"default":"cinema"},"showError":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
var PALETTES = {
  cinema:   { bg: '#0E0E10', surface: '#17171A', surface2: '#232328', border: '#2C2C33', text: '#F4F4F5', muted: '#A1A1AA', accent: '#F5B841', onAccent: '#1C1404', danger: '#FF8A8A' },
  midnight: { bg: '#0A0F1C', surface: '#111A2C', surface2: '#1B253A', border: '#253150', text: '#EDF2FB', muted: '#9BA8C2', accent: '#6CC6FF', onAccent: '#03131F', danger: '#FF8A8A' },
  plum:     { bg: '#130F17', surface: '#1C1721', surface2: '#282031', border: '#362C42', text: '#F6F1F9', muted: '#B3A6BF', accent: '#FF8F73', onAccent: '#2B0E06', danger: '#FF9A9A' }
};
function pad(n) { return String(n).padStart(2, '0'); }

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var c = PALETTES[this.props.palette ?? 'cinema'] || PALETTES.cinema;
    var st = this.state || {};
    var forced = !!(this.props.showError ?? false);
    var title = st.title !== undefined ? st.title : (forced ? '' : 'Severance');
    var season = st.season !== undefined ? st.season : 2;
    var episode = st.episode !== undefined ? st.episode : 7;
    var showError = (forced && st.title === undefined) || (!!st.submitted && title.trim() === '');
    function num(v) { var n = parseInt(v, 10); return isNaN(n) || n < 1 ? '' : n; }
    function stepper(key, label, val) {
      return {
        id: 'f-' + key, label: label, value: val,
        decLabel: 'Decrease ' + label.toLowerCase(), incLabel: 'Increase ' + label.toLowerCase(),
        dec: function () { var o = {}; o[key] = val === '' || val <= 1 ? '' : val - 1; self.setState(o); },
        inc: function () { var o = {}; o[key] = val === '' ? 1 : val + 1; self.setState(o); },
        onInput: function (ev) { var o = {}; o[key] = num(ev.target.value); self.setState(o); }
      };
    }
    return {
      c: c,
      title: title,
      onTitle: function (ev) { self.setState({ title: ev.target.value }); },
      showError: showError,
      titleInvalid: showError ? 'true' : 'false',
      titleBorder: showError ? c.danger : c.border,
      steppers: [stepper('season', 'Season', season), stepper('episode', 'Episode', episode)],
      progress: season === '' || episode === '' ? 'Not started' : 'S' + pad(season) + ' E' + pad(episode),
      save: function () { self.setState({ submitted: true, title: title }); }
    };
  }
}
</script>
</body>
</html>
