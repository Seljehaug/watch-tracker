    <rect class="line" stroke-width="30" x="136" y="190" width="240" height="182" rx="40"/>
    <path class="solid" stroke-width="18" d="M240 230v58l50-29z"/>
    <path class="line" stroke-width="22" stroke-opacity=".25" d="M184 324h144"/>
    <path class="line" stroke-width="22" d="M184 324h104"/>
  </g>
</svg>
