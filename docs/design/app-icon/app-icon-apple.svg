    .solid { fill: var(--color-background, #0e0e10); stroke: var(--color-background, #0e0e10); stroke-linejoin: round; }
  </style>
  <rect class="background" width="512" height="512"/>
  <g transform="translate(256 256) scale(1.25) translate(-256 -256)">
