# nginx's site for the Angular build (M2 A3, D65). The Dockerfile copies it over the image's
# default site, /etc/nginx/conf.d/default.conf. Goes when the .NET image takes over (M2 D1).
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    # Text compresses to about a third. The phone is on wifi, but the first load still counts.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app's routes (/shows/add, /shows/1/edit) are not files. Send a file if there is one,
    # otherwise index.html, and Angular's router picks the page from the URL in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the bundles by their hash (main-XXXXXXXX.js), so after a deploy the
    # browser must ask for a fresh copy; an old one points at bundles that are gone.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
