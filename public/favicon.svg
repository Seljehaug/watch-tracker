<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>:root { --color-accent: #f5b841; --color-background: #0e0e10; }</style>
  <!-- Simpler than the app icon so it reads in a tab: no progress bar. Lines fall on whole pixels at 16, 32 and 48 px. -->
  <style>
    .background { fill: var(--color-accent, #f5b841); }
    .line { fill: none; stroke: var(--color-background, #0e0e10); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: var(--color-background, #0e0e10); stroke: var(--color-background, #0e0e10); stroke-linejoin: round; }
  </style>
  <rect class="background" width="32" height="32" rx="6"/>
  <path class="line" d="M12 6l4 4 4-4"/>
  <rect class="line" x="7" y="11" width="18" height="14" rx="3"/>
  <path class="solid" d="M14 14.5v7l6-3.5z"/>
</svg>
